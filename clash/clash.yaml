allow-lan: true
bind-address: '*'
mode: rule
log-level: info
dns:
    enable: true
    ipv6: false
    default-nameserver: [223.5.5.5, 119.29.29.29, 114.114.114.114]
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    use-hosts: true
    respect-rules: true
    proxy-server-nameserver: [223.5.5.5, 119.29.29.29, 114.114.114.114]
    nameserver: [223.5.5.5, 119.29.29.29, 114.114.114.114]
    fallback: [1.1.1.1, 8.8.8.8]
    fallback-filter: { geoip: true, geoip-code: CN, geosite: [gfw], ipcidr: [240.0.0.0/4], domain: [+.google.com, +.facebook.com, +.youtube.com] }

# ----------------------------------------------------
# 1. 策略组配置 (Proxy Groups)
# ----------------------------------------------------
proxy-groups:
  - name: 剩余流量
    type: select
    include-all: true
    filter: "(?i)D"

  # 节点选择（总控）
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - DIRECT
    include-all: true
    exclude-filter: "(?i)D"

  # 自动选择（按延迟测速）
  - name: 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    exclude-filter: "(?i)D"

  # AI
  - name: AI
    type: select
    proxies:
      - 节点选择
    include-all: true
    filter: "(?i)🇯🇵|🇺🇸"
    exclude-filter: "(?i)D"

  # 谷歌服务
  - name: 谷歌服务
    type: select
    proxies:
      - 节点选择
      - 自动选择
    include-all: true
    filter: "(?i)🇯🇵|🇺🇸"
    exclude-filter: "(?i)D"

  # 电报消息
  - name: 电报消息
    type: select
    proxies:
      - 节点选择
      - 自动选择
    include-all: true
    filter: "(?i)🇯🇵|🇺🇸"
    exclude-filter: "(?i)D"

  # 苹果服务
  - name: 苹果服务
    type: select
    proxies:
      - DIRECT
      - 节点选择

  # 自定义代理流量
  - name: 自定义
    type: select
    proxies:
      - 节点选择
      - DIRECT
    include-all: true
    exclude-filter: "(?i)D"

  # 漏网之鱼（兜底）
  - name: 漏网之鱼
    type: select
    proxies:
      - 节点选择
      - DIRECT

