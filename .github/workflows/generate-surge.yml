name: Generate Surge Rule-Set

on:
  push:
    branches:
      - main
    paths:
      - 'clash/custom-proxy.txt'
      - 'clash/custom-direct.txt'
      - 'scripts/convert.py'
      - '.github/workflows/generate-surge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run Conversion Script
        run: python3 scripts/convert.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add surge/
          if git diff --staged --quiet; then
            echo "No changes in surge/ detected. Skipping commit."
          else
            git commit -m "chore: auto-generate surge rule-set files [skip ci]"
            git push
          fi
